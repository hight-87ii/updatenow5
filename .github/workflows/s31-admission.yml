name: S31 signed admission

on:
  pull_request:
  push:
    branches: [main, story/S-31-prevent-ticket-reuse, S-40-hang-doi-phong-cho-khi-luong-truy-cap-vuot-nguong]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s31-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  two-api-processes:
    name: S-31 / signed QR admission HTTP and browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://s31_signed:s31_fixture@127.0.0.1:15442/s31_signed_qr
      REDIS_URL: redis://127.0.0.1:16392
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "16392"
      API_INTERNAL_URL: http://127.0.0.1:3061
      S31_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HOLD_EXPIRY_MODE: "off"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: s31_signed
          POSTGRES_PASSWORD: s31_fixture
          POSTGRES_DB: s31_signed_qr
        ports: [15442:5432]
        options: >-
          --health-cmd "pg_isready -U s31_signed -d s31_signed_qr"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [16392:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm build
      - name: Configure private test fixtures outside checkout
        run: |
          echo "S31_FIXTURE_KEY_DIR=$RUNNER_TEMP/s31-keys" >> "$GITHUB_ENV"
          echo "S31_PRIVATE_FIXTURE_FILE=$RUNNER_TEMP/s31-browser.json" >> "$GITHUB_ENV"
      - run: node apps/api/scripts/verify-s31-http.mjs
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Real V1 scanner and exception dialog
        shell: bash
        run: |
          export SCANNER_KEY_ID=fixture-k1
          export SCANNER_SIGNING_PRIVATE_KEY_FILE="$S31_FIXTURE_KEY_DIR/fixture-k1.private.pem"
          export SCANNER_PUBLIC_KEYS="$(node --input-type=module -e 'import{readFileSync}from"node:fs";console.log(JSON.stringify({"fixture-k1":readFileSync(process.env.S31_FIXTURE_KEY_DIR+"/fixture-k1.public.pem","utf8")}))')"
          PORT=3061 WEB_ORIGIN=http://localhost:3060 node apps/api/dist/main.js > "$RUNNER_TEMP/s31-api.log" 2>&1 &
          API_PID=$!
          pnpm --filter web exec next start --hostname 127.0.0.1 --port 3060 > "$RUNNER_TEMP/s31-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3061/health >/dev/null && curl -fsS http://127.0.0.1:3060 >/dev/null; then break; fi
            sleep 1
          done
          node apps/web/scripts/verify-s31-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s31-signed-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/s31/*proof.json
            evidence/s31/*.png
          if-no-files-found: error
          retention-days: 14
