name: S-32 order history

on:
  pull_request:
  push:
    branches: [main, task/orders-integration-ready, S-40-hang-doi-phong-cho-khi-luong-truy-cap-vuot-nguong]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s32-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  order-history:
    name: S-32 / real history desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://s32_fixture:s32_fixture@127.0.0.1:15432/sprint2_integration
      REDIS_URL: redis://127.0.0.1:16381
      PORT: "3301"
      WEB_ORIGIN: http://localhost:3300
      API_INTERNAL_URL: http://localhost:3301
      S32_WEB_ORIGIN: http://localhost:3300
      S32_ISOLATED_TEST: "true"
      HOLD_EXPIRY_MODE: "off"
      ORDER_EXPIRY_MODE: "off"
      PAYMENT_GATEWAY: mock
      PAYMENT_WEBHOOK_SECRET: s32-ci-local-fixture-only
      S32_BROWSER_EVIDENCE_DIR: evidence/s32/ci/browser
      S32_PAYMENT_EVIDENCE_DIR: evidence/s32/ci/payment-continuation
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: s32_fixture
          POSTGRES_PASSWORD: s32_fixture
          POSTGRES_DB: sprint2_integration
        ports: [15432:5432]
        options: >-
          --health-cmd "pg_isready -U s32_fixture -d sprint2_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [16381:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Seed isolated buyer fixture and verify real UI
        shell: bash
        run: |
          export PLAYWRIGHT_MODULE="$(cd apps/web && node -p 'require.resolve("playwright")')"
          node apps/api/scripts/qr-keygen.mjs "$RUNNER_TEMP/s32-qr-keys" s32-ci
          export SCANNER_KEY_ID=s32-ci
          export SCANNER_SIGNING_PRIVATE_KEY_FILE="$RUNNER_TEMP/s32-qr-keys/s32-ci.private.pem"
          pnpm --filter api exec node --experimental-strip-types scripts/seed-order-history.mjs
          node apps/api/dist/main.js > "$RUNNER_TEMP/s32-api.log" 2>&1 &
          API_PID=$!
          pnpm --filter web exec next start --hostname 127.0.0.1 --port 3300 > "$RUNNER_TEMP/s32-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          ready=false
          for i in {1..60}; do
            if curl -fsS http://localhost:3301/health >/dev/null && curl -fsS http://localhost:3300 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          node --experimental-strip-types scripts/verify-s32-browser.mjs
          node --experimental-strip-types scripts/verify-order-payment-continuation.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s32-history-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/s32/ci
          if-no-files-found: warn
          retention-days: 14
